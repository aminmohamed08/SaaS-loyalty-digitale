<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>بطاقة الولاء الرقمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">

    <!-- إعدادات الأيقونة والتطبيق -->
    <link rel="icon" type="image/png" href="logo-mybusiness_fikra-automation.png">
    <link rel="apple-touch-icon" href="logo-mybusiness_fikra-automation.png">
    <meta name="theme-color" content="#020617">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="بطاقة الولاء">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">

    <style>
        :root { --ease-out: cubic-bezier(0.16, 1, 0.3, 1); }
        body { font-family: 'Tajawal', sans-serif; }

        /* ===== حركة الدخول: تسلسل واحد منظم عند فتح الصفحة ===== */
        @keyframes rise-in {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .reveal {
            opacity: 0;
            animation: rise-in 450ms var(--ease-out) forwards;
            animation-delay: calc(var(--i, 0) * 70ms);
        }

        /* ===== النقاط الدائرية ===== */
        .dot { transition: transform 250ms var(--ease-out), background-color 250ms ease-out, color 250ms ease-out; }
        .dot.is-on { transform: scale(1.08); }
        @keyframes dot-pop {
            0%   { transform: scale(0.6); }
            60%  { transform: scale(1.3); }
            100% { transform: scale(1.08); }
        }
        .dot.just-earned { animation: dot-pop 450ms var(--ease-out); }

        /* ===== شريط التقدم (transform فقط) ===== */
        #progress-bar {
            width: 100%;
            transform-origin: right center;
            transform: scaleX(0);
            transition: transform 500ms var(--ease-out);
        }

        /* ===== تفاعل الأزرار والحقول ===== */
        .btn {
            transition: transform 150ms var(--ease-out), background-color 150ms ease-out, box-shadow 150ms ease-out, opacity 150ms ease-out;
            will-change: transform;
        }
        .btn:hover  { transform: translateY(-1px); }
        .btn:active { transform: translateY(0) scale(0.97); }
        .btn:focus-visible, .field:focus-visible { outline: 2px solid #38bdf8; outline-offset: 2px; }
        .field { transition: border-color 150ms ease-out, box-shadow 150ms ease-out; }
        .field:focus { box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.2); }

        .btn.is-loading { pointer-events: none; opacity: 0.85; }
        .btn.is-loading .btn-label { opacity: 0.5; }
        .spinner {
            display: none; width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.35);
            border-top-color: #fff; border-radius: 9999px;
            animation: spin 700ms linear infinite;
        }
        .btn.is-loading .spinner { display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== الإشعار الترويجي ===== */
        @keyframes banner-in {
            from { opacity: 0; transform: translateY(-10px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        .banner-in { animation: banner-in 350ms var(--ease-out); }
        @keyframes soft-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.82; } }
        .soft-pulse { animation: soft-pulse 2.4s ease-in-out infinite; }

        .shop-logo { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }

        /* ===== قوالب المتجر (template_style) ===== */
        :root { --a: #38bdf8; --a2: #2563eb; --on: #ffffff; }
        body[data-tpl="classic_green"] { --a: #34d399; --a2: #047857; --on: #ffffff; }
        body[data-tpl="modern_dark"]   { --a: #38bdf8; --a2: #1e3a8a; --on: #ffffff; }
        body[data-tpl="luxury_gold"]   { --a: #fbbf24; --a2: #92400e; --on: #1c1917; }
        body[data-tpl="minimalist"]    { --a: #e2e8f0; --a2: #94a3b8; --on: #0f172a; }
        .hero { background: linear-gradient(135deg, var(--a), var(--a2)); color: var(--on); }
        .text-sky-400 { color: var(--a) !important; }
        .bg-sky-400 { background-color: var(--a) !important; }

        /* ===== نافذة تعليمات التثبيت ===== */
        #install-sheet-backdrop { opacity: 0; pointer-events: none; transition: opacity 200ms ease-out; }
        #install-sheet-backdrop.is-open { opacity: 1; pointer-events: auto; }
        #install-sheet { transform: translateY(24px); opacity: 0; transition: transform 350ms var(--ease-out), opacity 250ms ease-out; }
        #install-sheet-backdrop.is-open #install-sheet { transform: translateY(0); opacity: 1; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 1ms !important;
                animation-delay: 0ms !important;
                transition-duration: 1ms !important;
            }
            .reveal { opacity: 1; }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-800 rounded-3xl shadow-2xl overflow-hidden border border-slate-700 p-6 space-y-5">

        <!-- تحميل -->
        <div id="loading-section" class="py-10 flex justify-center" aria-live="polite">
            <span class="spinner !inline-block !w-7 !h-7" aria-label="جارٍ التحميل"></span>
        </div>

        <!-- خطأ: المحل غير موجود -->
        <div id="error-section" class="hidden text-center space-y-3 py-6" role="alert">
            <div class="text-3xl" aria-hidden="true">⚠️</div>
            <h1 class="text-base font-black text-red-400">تعذر فتح البطاقة</h1>
            <p id="error-text" class="text-xs text-slate-400 leading-relaxed"></p>
            <button onclick="location.reload()" class="btn px-5 py-2.5 bg-slate-700 hover:bg-slate-600 text-slate-100 font-semibold rounded-xl text-xs">إعادة المحاولة</button>
        </div>

        <!-- نموذج التسجيل -->
        <div id="register-section" class="hidden space-y-4">
            <div class="text-center space-y-2 reveal" style="--i:0">
                <div id="register-logo" class="w-16 h-16 bg-sky-500/20 text-sky-400 rounded-2xl mx-auto flex items-center justify-center font-bold text-xl border border-sky-500/30 overflow-hidden">☕</div>
                <h1 class="text-lg font-black text-sky-400 shop-name-slot"></h1>
                <p class="text-xs text-slate-400">أدخل معلوماتك لإنشاء بطاقة الولاء الخاصة بك</p>
            </div>

            <form onsubmit="handleRegistration(event)" class="space-y-3">
                <div class="reveal" style="--i:1">
                    <label for="user-name" class="block text-xs text-slate-300 mb-1">الاسم الكامل</label>
                    <input type="text" id="user-name" required autocomplete="name" placeholder="مثال: يوسف العلوي" class="field w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-sky-500">
                </div>
                <div class="reveal" style="--i:2">
                    <label for="user-phone" class="block text-xs text-slate-300 mb-1">رقم الهاتف</label>
                    <input type="tel" id="user-phone" required autocomplete="tel" inputmode="tel" placeholder="06XXXXXXXX" class="field w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-sky-500">
                </div>
                <button type="submit" id="register-btn" class="btn reveal w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-sm shadow-lg shadow-emerald-600/20 flex items-center justify-center gap-2" style="--i:3">
                    <span class="spinner" aria-hidden="true"></span>
                    <span class="btn-label">إنشاء بطاقتي الرقمية</span>
                </button>
            </form>
            <div id="register-error" class="text-xs text-center text-red-400 hidden" role="alert"></div>
        </div>

        <!-- بطاقة الولاء -->
        <div id="card-section" class="hidden space-y-4">
            <div id="cover-wrap" class="hidden h-28 rounded-2xl overflow-hidden border border-slate-700">
                <img id="cover-img" alt="" class="w-full h-full object-cover">
            </div>
            <div class="flex justify-between items-center border-b border-slate-700 pb-3 reveal" style="--i:0">
                <div class="flex items-center gap-2.5">
                    <div id="header-logo" class="w-9 h-9 rounded-xl bg-sky-500/15 border border-sky-500/30 overflow-hidden flex items-center justify-center text-base">☕</div>
                    <h2 class="text-sm font-bold text-sky-400 shop-name-slot"></h2>
                </div>
                <span id="display-cust-id" class="text-xs font-mono bg-slate-900 px-2.5 py-1 rounded-lg text-slate-300 border border-slate-700">CUST-000</span>
            </div>

            <!-- الإشعار الترويجي -->
            <div id="promo-banner" class="hidden bg-amber-500/15 border border-amber-500/40 rounded-2xl p-3 flex items-start gap-3 shadow-lg relative soft-pulse">
                <div class="relative">
                    <span class="text-amber-400 text-lg mt-0.5 block">🔔</span>
                    <span id="notif-badge" class="absolute -top-1 -right-1 bg-red-500 text-white text-[9px] font-black w-4 h-4 rounded-full flex items-center justify-center shadow-md hidden">1</span>
                </div>
                <div class="space-y-0.5 flex-1">
                    <h4 class="text-xs font-bold text-amber-400 flex justify-between items-center">
                        <span>إشعار جديد من المقهى</span>
                        <span class="text-[9px] text-slate-400 font-normal">الآن</span>
                    </h4>
                    <p id="promo-text" class="text-[11px] text-slate-200 leading-relaxed"></p>
                </div>
            </div>

            <div class="hero rounded-2xl p-5 space-y-3 shadow-xl text-center reveal" style="--i:1">
                <p class="text-xs opacity-90">أعطِ هذا الرمز للكاشيير لتسجيل النقطة</p>
                <div class="bg-white p-3 rounded-xl inline-block shadow-inner">
                    <div id="qrcode"></div>
                </div>
                <div class="text-xs font-medium opacity-90">
                    الزبون: <span id="display-name" class="font-bold underline"></span>
                </div>
            </div>

            <!-- النقاط الدائرية التدريجية -->
            <div class="bg-slate-900/60 p-4 rounded-2xl border border-slate-700 space-y-3 reveal" style="--i:2">
                <div class="flex justify-between text-xs font-medium">
                    <span class="text-slate-300">النقاط المحصل عليها:</span>
                    <span class="text-sky-400 font-bold"><span id="current-points">0</span> / <span id="max-points">5</span> نقاط</span>
                </div>

                <div class="flex flex-wrap items-center gap-y-2 px-1" id="dots-container"></div>

                <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                    <div id="progress-bar" class="bg-sky-400 h-full rounded-full"></div>
                </div>

                <p id="points-to-gift" class="text-[11px] text-center text-slate-400 pt-1"></p>
            </div>

            <button id="install-btn" onclick="installApp()" class="btn reveal w-full py-3 bg-sky-500 hover:bg-sky-400 text-white font-semibold rounded-xl text-xs shadow-md flex items-center justify-center gap-2" style="--i:3">
                <span aria-hidden="true">📱</span>
                <span class="btn-label">إضافة البطاقة إلى الشاشة الرئيسية</span>
            </button>
        </div>

    </div>

    <!-- تعليمات التثبيت -->
    <div id="install-sheet-backdrop" class="fixed inset-0 bg-slate-950/70 flex items-end sm:items-center justify-center p-4 z-50" onclick="closeInstallSheet(event)">
        <div id="install-sheet" class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-3xl p-6 space-y-4 shadow-2xl" role="dialog" aria-modal="true" aria-labelledby="install-title">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-2xl overflow-hidden bg-sky-500/15 border border-sky-500/30 flex items-center justify-center text-lg" id="sheet-logo">☕</div>
                <div>
                    <h3 id="install-title" class="text-sm font-black text-sky-400">ثبّت البطاقة كتطبيق</h3>
                    <p class="text-[11px] text-slate-400">ستظهر على شاشتك الرئيسية بشعار المطعم</p>
                </div>
            </div>
            <ol id="install-steps" class="space-y-2 text-xs text-slate-200 leading-relaxed list-decimal pr-5"></ol>
            <button class="btn w-full py-2.5 bg-slate-700 hover:bg-slate-600 text-slate-100 font-semibold rounded-xl text-xs" onclick="closeInstallSheet()">فهمت</button>
        </div>
    </div>

    <script>
        /* ========= اتصال Supabase ========= */
        const SUPABASE_URL = "https://wjmcxewruhvtgffkfmlh.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqbWN4ZXdydWh2dGdmZmtmbWxoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzOTg5MTgsImV4cCI6MjEwNjk3NDkxOH0.2u584JsGX96zEFOxv6s71BEonuuKIVh4xoCoQHgWxLQ";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        /* =================================== */

        const DEFAULT_LOGO = "logo-mybusiness_fikra-automation.png";
        const DEFAULT_MAX = 5;
        const params = new URLSearchParams(location.search);
        const shopId = params.get('shop') || localStorage.getItem('last_shop') || '';
        const state = { shop: null, customer: null };

        let lastPoints = null;      // null = أول تحميل (بدون صوت)
        let lastSeenPromo = shopId ? (localStorage.getItem(`seen_promo_${shopId}`) || '') : '';
        let deferredInstallPrompt = null;
        let syncing = false;
        let channel = null;

        const $ = (id) => document.getElementById(id);
        const maxPoints = () => Math.max(1, state.shop?.max_points || DEFAULT_MAX);
        const show = (id) => $(id).classList.remove('hidden');
        const hide = (id) => $(id).classList.add('hidden');

        window.addEventListener('DOMContentLoaded', init);

        async function init() {
            registerServiceWorker();
            setupInstall();

            if (!shopId) return fail('الرابط غير مكتمل. امسح رمز المحل (QR) من جديد.');

            try {
                state.shop = await fetchShop();
                if (!state.shop) return fail('هذا المحل غير موجود. تأكد من الرابط وحاول مرة أخرى.');
                localStorage.setItem('last_shop', shopId);
                applyBranding();

                const customerId = params.get('customer') || localStorage.getItem(`customer_${shopId}`);
                if (customerId) {
                    state.customer = await fetchCustomer(customerId);
                    if (!state.customer) localStorage.removeItem(`customer_${shopId}`);
                }
            } catch (err) {
                return fail('تعذر الاتصال بالخادم. تأكد من الإنترنت وحاول مرة أخرى.');
            }

            hide('loading-section');
            if (state.customer) { showCardView(); } else { show('register-section'); }
            startSync();
        }

        function fail(msg) {
            hide('loading-section');
            hide('card-section');
            hide('register-section');
            $('error-text').textContent = msg;
            show('error-section');
        }

        /* ---------- جلب البيانات ---------- */
        // لا نطلب email أو admin_code_hash أبداً من صفحة الزبون
        async function fetchShop() {
            // العرض public_shops يُرجع المتاجر المفعّلة فقط وبدون أي بيانات حساسة
            const { data, error } = await db.from('public_shops')
                .select('id,name,max_points,promo_text,logo_url,cover_url,template_style')
                .eq('id', shopId).maybeSingle();
            if (error) throw error;
            return data;
        }

        async function fetchCustomer(customerId) {
            const { data, error } = await db.from('customers')
                .select('customer_id,name,phone,points,gifts_redeemed')
                .eq('shop_id', shopId).eq('customer_id', customerId).maybeSingle();
            if (error) throw error;
            return data;
        }

        /* ---------- الهوية البصرية ---------- */
        let brandSig = '';
        const brandSignature = (s) => [s.name, s.logo_url, s.cover_url, s.template_style].join('|');

        function applyBranding() {
            const s = state.shop;
            brandSig = brandSignature(s);
            document.querySelectorAll('.shop-name-slot').forEach(el => el.textContent = s.name);
            document.title = `بطاقة الولاء - ${s.name}`;
            const appTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
            if (appTitle) appTitle.setAttribute('content', s.name);
            document.body.dataset.tpl = s.template_style || 'classic_green';
            ['register-logo', 'header-logo', 'sheet-logo'].forEach(id => setLogo($(id)));

            const cover = /^https:\/\//i.test(s.cover_url || '') ? s.cover_url : '';
            const wrap = $('cover-wrap'), img = $('cover-img');
            if (cover) {
                img.onload = () => wrap.classList.remove('hidden');
                img.onerror = () => wrap.classList.add('hidden');
                img.src = cover;
            } else {
                wrap.classList.add('hidden');
                img.removeAttribute('src');
            }
        }

        function setLogo(container) {
            if (!container) return;
            const img = new Image();
            img.className = 'shop-logo';
            img.alt = state.shop.name;
            img.onload = () => { container.textContent = ''; container.appendChild(img); };
            img.onerror = () => {
                if (!img.src.endsWith(DEFAULT_LOGO)) img.src = DEFAULT_LOGO; // شعار افتراضي ثم الإيموجي ☕
            };
            img.src = state.shop.logo_url || DEFAULT_LOGO;
        }

        /* ---------- التسجيل ---------- */
        function newCustomerId() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let s = '';
            const bytes = crypto.getRandomValues(new Uint8Array(6));
            bytes.forEach(b => s += chars[b % chars.length]);
            return `CUST-${s}`;
        }

        async function handleRegistration(e) {
            e.preventDefault();
            const name = $('user-name').value.trim();
            const phone = $('user-phone').value.replace(/\s+/g, '');
            if (!name || !phone) return;

            const btn = $('register-btn');
            const errEl = $('register-error');
            errEl.classList.add('hidden');
            btn.classList.add('is-loading');

            try {
                // زبون موجود بنفس الرقم في هذا المحل؟ نعيد استعمال بطاقته
                let { data: existing, error } = await db.from('customers')
                    .select('customer_id,name,phone,points,gifts_redeemed')
                    .eq('shop_id', shopId).eq('phone', phone).maybeSingle();
                if (error) throw error;

                if (!existing) {
                    const row = { customer_id: newCustomerId(), shop_id: shopId, name, phone, points: 0, gifts_redeemed: 0 };
                    const ins = await db.from('customers').insert(row).select('customer_id,name,phone,points,gifts_redeemed').single();
                    if (ins.error) throw ins.error;
                    existing = ins.data;
                }

                state.customer = existing;
                localStorage.setItem(`customer_${shopId}`, existing.customer_id);
                history.replaceState(null, '', `?shop=${encodeURIComponent(shopId)}&customer=${encodeURIComponent(existing.customer_id)}`);
                hide('register-section');
                showCardView();
                startSync();
            } catch (err) {
                errEl.textContent = "❌ تعذر إنشاء البطاقة. تأكد من الاتصال بالإنترنت وحاول مرة أخرى.";
                errEl.classList.remove('hidden');
            } finally {
                btn.classList.remove('is-loading');
            }
        }

        /* ---------- عرض البطاقة ---------- */
        function showCardView() {
            const card = $('card-section');
            show('card-section');
            card.querySelectorAll('.reveal').forEach(el => {
                el.style.animation = 'none';
                void el.offsetWidth;
                el.style.animation = '';
            });

            $('display-name').textContent = state.customer.name;
            $('display-cust-id').textContent = state.customer.customer_id;

            $('qrcode').innerHTML = "";
            new QRCode($('qrcode'), {
                text: `customer:${state.customer.customer_id}`,
                width: 110, height: 110,
                colorDark: "#0B2545", colorLight: "#ffffff"
            });

            updateProgressUI();
            checkPromoBanner();
            refreshInstallButton();
        }

        /* ---------- النقاط (ديناميكية حسب max_points) ---------- */
        function renderDots(points, justEarnedIndex = -1) {
            const max = maxPoints();
            const container = $('dots-container');
            container.className = `flex flex-wrap items-center gap-y-2 px-1 ${max <= 6 ? 'justify-between' : 'justify-center gap-x-2'}`;
            container.innerHTML = '';
            for (let i = 1; i <= max; i++) {
                const on = i <= points;
                const dot = document.createElement('div');
                dot.className = `dot w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold ${
                    on ? 'is-on bg-sky-400 text-slate-950 shadow-md' : 'bg-slate-800 text-slate-500 border border-slate-700'
                }${i === justEarnedIndex ? ' just-earned' : ''}`;
                dot.textContent = i;
                container.appendChild(dot);
            }
        }

        function updateProgressUI() {
            if (!state.customer) return;
            const max = maxPoints();
            const points = Math.min(state.customer.points || 0, max);
            const earned = lastPoints !== null && points > lastPoints;
            const rebuild = lastPoints === null || points !== lastPoints || $('dots-container').children.length !== max;

            if (earned) playNotificationSound();
            lastPoints = points;

            $('current-points').textContent = points;
            $('max-points').textContent = max;
            const remaining = Math.max(0, max - points);
            $('points-to-gift').textContent = remaining === 0
                ? '🎉 مبروك! استحقيت الهدية المجانية!'
                : `بقيت ${remaining} نقاط للحصول على الهدية المجانية! 🎁`;
            $('progress-bar').style.transform = `scaleX(${points / max})`;

            if (rebuild) renderDots(points, earned ? points : -1);
        }

        /* ---------- الإشعارات الترويجية (من shops.promo_text) ---------- */
        function checkPromoBanner() {
            const promo = (state.shop?.promo_text || '').trim();
            const banner = $('promo-banner');
            const badge = $('notif-badge');

            if (promo) {
                const wasHidden = banner.classList.contains('hidden');
                $('promo-text').textContent = promo;
                banner.classList.remove('hidden');
                if (wasHidden) {
                    banner.classList.remove('banner-in');
                    void banner.offsetWidth;
                    banner.classList.add('banner-in');
                }
                document.title = `(1) إشعار جديد - ${state.shop.name}`;

                if (promo !== lastSeenPromo) {
                    playNotificationSound();
                    badge.classList.remove('hidden');
                    if ('setAppBadge' in navigator) navigator.setAppBadge(1).catch(() => {});
                    lastSeenPromo = promo;
                    localStorage.setItem(`seen_promo_${shopId}`, promo);
                }
            } else {
                banner.classList.add('hidden');
                badge.classList.add('hidden');
                document.title = `بطاقة الولاء - ${state.shop.name}`;
                if ('clearAppBadge' in navigator) navigator.clearAppBadge().catch(() => {});
            }
        }

        /* ---------- المزامنة: Realtime + استطلاع احتياطي ---------- */
        async function syncNow() {
            if (syncing || !state.shop) return;
            syncing = true;
            try {
                const shop = await fetchShop();
                if (!shop) { fail('هذه البطاقة متوقفة حالياً. تواصل مع المحل.'); return; }
                state.shop = shop;
                if (!$('error-section').classList.contains('hidden')) {
                    hide('error-section');
                    show(state.customer ? 'card-section' : 'register-section');
                }
                if (brandSignature(shop) !== brandSig) applyBranding();
                if (state.customer) {
                    const c = await fetchCustomer(state.customer.customer_id);
                    if (c) state.customer = c;
                }
                if (state.customer && !$('card-section').classList.contains('hidden')) {
                    updateProgressUI();
                    checkPromoBanner();
                }
            } catch (err) {
                /* بدون إنترنت: نحتفظ بآخر حالة معروضة */
            } finally {
                syncing = false;
            }
        }

        let syncStarted = false;
        function startSync() {
            if (syncStarted) { subscribeRealtime(); return; }
            syncStarted = true;
            setInterval(syncNow, 5000);
            document.addEventListener('visibilitychange', () => { if (!document.hidden) syncNow(); });
            subscribeRealtime();
        }

        function subscribeRealtime() {
            if (channel) { db.removeChannel(channel); channel = null; }
            // تغييرات المتجر (اسم، نقاط، قالب، صور، إشعار، تعطيل): تصل عبر Broadcast من قاعدة البيانات
            channel = db.channel(`shop:${shopId}`)
                .on('broadcast', { event: 'shop_updated' }, () => setTimeout(syncNow, 250));
            if (state.customer) {
                channel.on('postgres_changes', { event: '*', schema: 'public', table: 'customers', filter: `customer_id=eq.${state.customer.customer_id}` }, syncNow);
            }
            channel.subscribe();
        }

        /* ---------- تثبيت التطبيق ---------- */
        function registerServiceWorker() {
            if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
        }

        function isStandalone() {
            return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        }

        function isIOS() {
            return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
                   (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        }

        function setupInstall() {
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredInstallPrompt = e;
                refreshInstallButton();
            });
            window.addEventListener('appinstalled', () => {
                deferredInstallPrompt = null;
                refreshInstallButton();
            });
        }

        function refreshInstallButton() {
            const btn = $('install-btn');
            if (btn) btn.classList.toggle('hidden', isStandalone());
        }

        async function installApp() {
            const btn = $('install-btn');
            if (deferredInstallPrompt) {
                btn.classList.add('is-loading');
                deferredInstallPrompt.prompt();
                try { await deferredInstallPrompt.userChoice; } catch (e) {}
                deferredInstallPrompt = null;
                btn.classList.remove('is-loading');
                refreshInstallButton();
                return;
            }
            const items = isIOS()
                ? [
                    'افتح هذه الصفحة في متصفح <strong>Safari</strong>.',
                    'اضغط على زر المشاركة <strong>(مربع بسهم لأعلى)</strong> أسفل الشاشة.',
                    'اختر <strong>«إضافة إلى الشاشة الرئيسية»</strong> ثم اضغط <strong>إضافة</strong>.'
                  ]
                : [
                    'اضغط على قائمة المتصفح <strong>(⋮ النقاط الثلاث)</strong>.',
                    'اختر <strong>«تثبيت التطبيق»</strong> أو <strong>«إضافة إلى الشاشة الرئيسية»</strong>.',
                    'أكّد بالضغط على <strong>تثبيت</strong>.'
                  ];
            $('install-steps').innerHTML = items.map(t => `<li>${t}</li>`).join('');
            $('install-sheet-backdrop').classList.add('is-open');
        }

        function closeInstallSheet(e) {
            if (e && e.target !== $('install-sheet-backdrop')) return;
            $('install-sheet-backdrop').classList.remove('is-open');
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') $('install-sheet-backdrop').classList.remove('is-open');
        });

        /* ---------- صوت الجرس ---------- */
        function playNotificationSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                if (ctx.state === 'suspended') ctx.resume();

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch (e) { /* الصوت غير مدعوم أو محظور */ }
        }
    </script>
</body>
